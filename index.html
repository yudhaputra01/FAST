<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolkit Klaim Warranty & Invoice | PT. New Ratna Motor</title>
<style>
  :root{
    --c1:#0F3460;--c2:#16213E;
    --teal:#0EA5E9;--indigo:#6366F1;
    --bg:#EEF1F6;--surface:#fff;--border:#E2E8F0;
    --text:#0F172A;--muted:#64748B;
    --toyota-red:#c8102e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Segoe UI',Inter,Arial,sans-serif;background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;min-height:100vh}

  header{background:linear-gradient(135deg,var(--c2) 0%,var(--c1) 60%,#1B4F8A 100%);
         padding:0 24px;position:relative;overflow:hidden;flex:none}
  header::before{content:'';position:absolute;inset:0;
         background:radial-gradient(ellipse at 80% 50%,rgba(14,165,233,.18) 0%,transparent 60%);
         pointer-events:none}
  .header-inner{display:flex;align-items:center;gap:16px;padding:18px 0;position:relative;z-index:1;
         max-width:1300px;margin:0 auto;flex-wrap:wrap}
  .logo-box{width:44px;height:44px;border-radius:12px;flex-shrink:0;
         background:linear-gradient(135deg,var(--teal),var(--indigo));
         display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;
         box-shadow:0 4px 12px rgba(14,165,233,.4)}
  .header-text h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:.5px}
  .header-text p.subtitle{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;font-weight:500}
  .logo-slot{background:#fff;padding:6px;overflow:hidden}
  .logo-slot img{width:100%;height:100%;object-fit:contain;display:block}

  .header-brands{margin-left:auto;display:flex;align-items:center;gap:14px;
         background:rgba(255,255,255,.92);padding:8px 18px;border-radius:12px;
         box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .brand-logo-img{height:26px;width:auto;object-fit:contain;display:block}
  .brand-logo-img.nasmoco{height:34px}
  .brand-divider{width:1px;height:28px;background:#D8DCE3}

  nav.tabs{background:#fff;border-bottom:1px solid var(--border);flex:none;
         position:sticky;top:0;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .tabs-inner{max-width:1300px;margin:0 auto;display:flex;gap:4px;padding:0 20px;overflow-x:auto}
  .tab-btn{appearance:none;border:none;background:transparent;cursor:pointer;
         padding:14px 18px;font-size:13px;font-weight:600;color:var(--muted);
         border-bottom:3px solid transparent;white-space:nowrap;
         display:flex;align-items:center;gap:8px;transition:color .15s,border-color .15s}
  .tab-btn:hover{color:var(--c1)}
  .tab-btn.active{color:var(--c1);border-bottom-color:var(--teal)}
  .tab-icon{font-size:16px}

  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .app-panel{display:none;flex:1;min-height:0;flex-direction:column}
  .app-panel.active{display:flex}
  .app-panel iframe{flex:1;width:100%;height:100%;border:0;min-height:70vh;background:#fff}

  .loading-msg{display:flex;align-items:center;justify-content:center;flex:1;
         color:var(--muted);font-size:13px;gap:10px}
  .spinner{width:16px;height:16px;border:2.5px solid #E2E8F0;border-top-color:var(--teal);
         border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{text-align:center;font-size:11px;color:var(--muted);padding:10px;flex:none;
         background:#fff;border-top:1px solid var(--border)}
</style>
</head>

function b64ToUtf8(b64){
  return decodeURIComponent(
    atob(b64).split('').map(function(c){
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')
  );
}

const loadedTabs = {};

function loadTab(key){
  if(loadedTabs[key]) return; // sudah dimuat, jangan reload (biar data tidak hilang)
  const iframe = document.getElementById('frame-' + key);
  const loading = document.getElementById('loading-' + key);
  try{
    const html = b64ToUtf8(MODULES_B64[key]);
    iframe.srcdoc = html;
    iframe.addEventListener('load', function onLoad(){
      loading.style.display = 'none';
      iframe.style.display = 'block';
      iframe.removeEventListener('load', onLoad);
    });
    loadedTabs[key] = true;
  }catch(e){
    loading.innerHTML = '⚠️ Gagal memuat modul: ' + e.message;
    console.error(e);
  }
}

function switchTab(key){
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === key);
  });
  document.querySelectorAll('.app-panel').forEach(function(p){
    p.classList.toggle('active', p.id === 'panel-' + key);
  });
  loadTab(key);
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); });
});

// Muat tab pertama saat halaman dibuka
switchTab('twc');
